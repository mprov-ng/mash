name: Tests
on:
  push:
    branches:
      - master
    paths-ignore:
      # Agent instructions only; they can't affect the tests.
      - 'AGENTS.md'
      - 'CLAUDE.md'
  pull_request:
    branches:
      - master
    paths-ignore:
      # Agent instructions only; they can't affect the tests.
      - 'AGENTS.md'
      - 'CLAUDE.md'
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.9 is Rocky 9's system Python.
        python-version: ["3.9", "3.11", "3.13"]
        deps: ["latest"]
        include:
          # the lower bounds in requirements.txt: Rocky 9's packages (#45)
          - python-version: "3.9"
            deps: "minimum"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ${{ matrix.deps == 'minimum' && '-c tests/min-versions.txt' || '' }}
          pip list

      - name: Run tests
        run: python -m pytest -v tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # errors only; the rules are in pyproject.toml (#46)
      - name: Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.17.3
          ruff check --output-format github .

      - name: ShellCheck
        run: shellcheck --version && shellcheck -S error src/mash/mash gen_changelog.sh
