[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff.lint]
# Errors only for now (#46): syntax errors, invalid comparisons/statements
# and undefined names; no style rules.
select = ["E9", "F63", "F7", "F82"]
